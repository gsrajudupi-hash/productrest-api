spring.application.name=product-restapi

#Tomcat Server Configuration
server.port=8088
server.servlet.context-path=/producthive

#Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/producthivedb?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=redhat
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#Hibernate-JPA Configuration	
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
app.jwt.secret=MyLocalDevelopmentSecretKey12345678901234567890
app.jwt.expiration-ms=3600000